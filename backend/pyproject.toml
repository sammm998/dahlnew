[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthangers"
version = "0.1.0"
description = "Från samordnad IFC-modell till prefabricerade, spårbara rörupphängningar (MVP)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "ifcopenshell>=0.8",
  "numpy>=1.26",
  "reportlab>=4.0",
  "anthropic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["smarthangers*"]

[tool.setuptools.package-data]
smarthangers = ["static/*", "rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
